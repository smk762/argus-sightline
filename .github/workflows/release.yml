name: Release

# On a v* tag: check the tag against package.json and CHANGELOG.md, push the
# image to ghcr.io/<owner>/argus-sightline (amd64 and arm64, each built on a
# native runner), then create the GitHub Release from the tag's CHANGELOG.md
# section. Nothing goes to npm: the package is private.
#
# The image takes no build-time configuration. ARGUS_SURVEY_URL and the rest
# are read from the container's environment per request
# (src/lib/runtimeConfig.ts), so one image deploys to any origin.
#
# A new GHCR package starts private: after the first release, make
# ghcr.io/<owner>/argus-sightline public once in the package settings.

on:
  push:
    # Require a digit after `v` so a stray tag (vtest, v-wip) can't publish.
    tags: ["v[0-9]*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; each job asks for what it needs.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/argus-sightline

jobs:
  verify:
    # Before anything publishes: a tag that disagrees with package.json, or has
    # no CHANGELOG section, fails here rather than after the image is on GHCR.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json and has a CHANGELOG section
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg=$(jq -r .version package.json)
          if [ "$pkg" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi
          if ! grep -qF "## [${version}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi

  # Each architecture builds natively on its own runner and pushes by digest
  # only (no tag yet); `publish-image` then joins the two digests into one
  # tagged manifest list. Docker's "distribute build across multiple runners"
  # pattern: https://docs.docker.com/build/ci/github-actions/multi-platform/
  #
  # arm64 used to build under QEMU on an amd64 runner. argus-studio's v0.4.0
  # release died that way (`qemu: uncaught target signal 4 (Illegal
  # instruction)` in the emulated `npm ci`, then a hang until the timeout), so
  # this follows argus-studio#187: native arm64 runners (`ubuntu-24.04-arm`,
  # free for public repositories) take QEMU out of the picture.
  build-image:
    needs: verify
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # A native build takes a few minutes. These limits make a hang fail fast
    # instead of holding the release for half an hour.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the labels are used here; the tags are applied in publish-image.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v6
        timeout-minutes: 15
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          # One manifest per platform: skip the provenance attestation that
          # otherwise adds an `unknown/unknown` entry on GHCR.
          provenance: false
          # One cache per architecture, so the two builds don't evict each
          # other's layers.
          cache-from: type=gha,scope=release-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=release-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-image:
    # Tags the two per-architecture digests as one multi-platform image. Nothing
    # is tagged unless both architectures built.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build-image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # X.Y.Z and X.Y; `latest` comes from the default `flavor: latest=auto`,
          # which tags only the newest non-pre-release semver, so an rc tag
          # gets its own X.Y.Z-rc.N tag and moves neither X.Y nor latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create the manifest list and push the tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          count=$(find . -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 platform digests, found ${count}"
            exit 1
          fi
          mapfile -t tag_args < <(jq -r '.tags[] | "--tag", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for digest in *; do
            refs+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"

      - name: Inspect the image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  github-release:
    # The GitHub Release is the last step, so it only appears once the image is
    # actually on GHCR. Its notes are this version's CHANGELOG.md section, with
    # the image to pull appended. Nothing is built besides the image, so the
    # Release carries no assets. Ported from argus-studio#181.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish-image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/argus-sightline
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [${version}]" 'index($0, head) == 1 {found = 1; next} found && /^## \[/ {exit} found' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi
          # Drop the link-reference definitions at the foot of the last section.
          sed -i '/^\[[^]]*\]: /d' notes.md
          {
            echo
            echo "### Image"
            echo
            echo '```sh'
            echo "docker pull ${IMAGE}:${version}"
            echo '```'
          } >> notes.md
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          case "$tag" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-run of the workflow: refresh the notes rather than failing.
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" --verify-tag --title "$tag" --notes-file notes.md $prerelease
          fi
